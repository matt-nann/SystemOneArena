# Local stack (OrbStack or Docker Desktop): `docker compose up --build`, then http://localhost:8000.
# By default the arena talks to the mock over the compose network, so no OpenRouter key is needed.
# To play real models, put OPENROUTER_API_KEY in .env and run with the override:
#   docker compose -f docker-compose.yml -f docker-compose.real.yml up --build arena
services:
  arena:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPENROUTER_BASE_URL: http://mock-openrouter:8790/api/v1
      OPENROUTER_DECISIONS_URL: http://mock-openrouter:8790/api/alpha/decisions
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-mock-key}
      LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      mock-openrouter:
        condition: service_healthy

  mock-openrouter:
    build: .
    command: ["python", "-m", "mock_openrouter"]
    ports:
      - "8790:8790"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8790/api/v1/models"]
      interval: 5s
      timeout: 3s
      retries: 10
